name: tests

# The regression suite guards the renderer's geometry, the glyph coverage,
# the converters and the app's limits. It runs on every push so the safety
# net stops depending on somebody remembering to hold it.
#
# The two real-paper fixtures are not in the repository (large, and someone
# else's writing), so those checks skip here: the suite prints them as
# skipped and still exits by the checks it did run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # correctness rules only (pyflakes, bugbear); see pyproject.toml
      - run: ruff check .

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the regression suite
        run: python tests/regression.py

  # The image is what would be deployed, so it is built and driven for real:
  # it has to come up healthy and turn text into a page.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t text2hand .

      - name: Start
        run: docker run -d --name t2h -p 8000:8000 text2hand

      - name: Smoke test
        run: python tests/smoke.py http://127.0.0.1:8000

      - name: Logs
        if: always()
        run: docker logs t2h
