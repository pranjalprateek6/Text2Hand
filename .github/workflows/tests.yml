name: tests

# The regression suite guards the renderer's geometry, the glyph coverage,
# the converters and the app's limits. It runs on every push so the safety
# net stops depending on somebody remembering to hold it.
#
# The two real-paper fixtures are not in the repository (large, and someone
# else's writing), so those checks skip here: the suite prints them as
# skipped and still exits by the checks it did run.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # correctness rules only (pyflakes, bugbear); see pyproject.toml
      - run: ruff check .

  # Type check against the exact versions the image ships, so a library's
  # stubs changing under a version range cannot fail the build by surprise.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock mypy==2.4.0
      # files and settings are in pyproject.toml
      - run: mypy

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the regression suite
        run: python tests/regression.py

  # The image is what would be deployed, so it is built and driven for real:
  # it has to come up healthy and turn text into a page.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t text2hand .

      - name: Start
        run: docker run -d --name t2h -p 8000:8000 text2hand

      - name: Smoke test
        run: python tests/smoke.py http://127.0.0.1:8000

      - name: Logs
        if: always()
        run: docker logs t2h

  # Every change that lands on main, once everything above has passed on it,
  # is published to GitHub's container registry as
  #   ghcr.io/<owner>/text2hand:latest   and   :sha-<commit>
  # so any host can run the exact build that passed. It lives in this
  # workflow, gated on a push to this repository's main, rather than in a
  # workflow_run trigger: that one matches on branch name alone, and a fork's
  # pull request can call its branch main too. Third-party actions are pinned
  # to commits because this job holds a token that can write packages.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'pranjalprateek6'
    needs: [lint, types, suite, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/text2hand" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:sha-${{ github.sha }}
