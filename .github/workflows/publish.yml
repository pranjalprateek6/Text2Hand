name: publish

# Every change that lands on main, once the suite has passed on it, is built
# into the Docker image and published to GitHub's container registry as
#   ghcr.io/<owner>/text2hand:latest   and   :sha-<commit>
# so any host can run the exact build that passed: pull it and start it.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: name
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/text2hand" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:sha-${{ github.event.workflow_run.head_sha }}
